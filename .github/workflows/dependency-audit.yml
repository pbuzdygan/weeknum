name: Dependency Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-release-win.txt

      - name: Install pip-audit
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit release build dependencies
        shell: pwsh
        run: |
          python -m pip_audit --require-hashes -r requirements-release-win.txt
