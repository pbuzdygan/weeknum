name: Build Windows EXE on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and upload, e.g. dev0.21"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-release-win.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.1
          if (Test-Path "requirements-release-win.txt") {
            $req = Get-Content "requirements-release-win.txt" -Raw -ErrorAction SilentlyContinue
            if ($null -ne $req) { $req = $req.Trim() }
            if (-not [string]::IsNullOrWhiteSpace($req)) {
              python -m pip install --only-binary=:all: --require-hashes -r requirements-release-win.txt
            }
          }

      - name: Prepare version info
        shell: pwsh
        run: |
          $versionJson = python -c "import json, os; from dataclasses import asdict; from weeknum_core import resolve_build_version; print(json.dumps(asdict(resolve_build_version(os.environ.get('RELEASE_TAG')))))"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve build version for tag: $env:RELEASE_TAG"
          }

          $versionInfo = $versionJson | ConvertFrom-Json
          $versionTuple = $versionInfo.file_version -join ", "
          $versionStr = $versionInfo.product_version
          "BUILD_IS_DEVELOPMENT=$($versionInfo.is_development.ToString().ToLowerInvariant())" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "BUILD_VERSION = '$versionStr'" `
            | Set-Content "weeknum_build.py" -Encoding utf8

          (Get-Content "version_info.txt" -Raw) `
            -replace "__VERSION_TUPLE__", $versionTuple `
            -replace "__VERSION_STR__", $versionStr `
            | Set-Content "version_info.txt" -Encoding UTF8

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name WeekNumApp --clean --icon icons\WeekNum.ico --add-data "branding\weeknum_banner.png;branding" --add-data "icons\WeekNum.ico;icons" --version-file version_info.txt weeknum_app.py

      - name: Name EXE (dev releases)
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.0" }
          $ver = $tag.TrimStart("v", "V")

          $exeName = "WeekNumApp.exe"
          if ($env:BUILD_IS_DEVELOPMENT -eq "true") {
            $exeName = "WeekNumApp_$ver.exe"
            Rename-Item -Path "dist\\WeekNumApp.exe" -NewName $exeName -Force
          }

          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package (zip)
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.run_number }}" }
          $zipName = "WeekNumApp-$tag-windows-x64.zip"
          Compress-Archive -Path "dist\\${{ env.EXE_NAME }}" -DestinationPath $zipName -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.run_number }}" }
          $shaName = "WeekNumApp-$tag-SHA256SUMS.txt"
          $zipHash = (Get-FileHash "${{ env.ZIP_NAME }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  ${{ env.ZIP_NAME }}" | Out-File -FilePath $shaName -Encoding ascii
          "SHA256_NAME=$shaName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/${{ env.SHA256_NAME }}

      - name: Upload artifacts to Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Release tag is missing." }
          if ($env:BUILD_IS_DEVELOPMENT -eq "true") {
            gh release upload $tag "${{ env.ZIP_NAME }}" "${{ env.SHA256_NAME }}" --clobber
          } else {
            # Stable assets are intentionally append-only. A rerun fails instead of
            # silently replacing a package that users may have already verified.
            gh release upload $tag "${{ env.ZIP_NAME }}" "${{ env.SHA256_NAME }}"
          }

      - name: Cleanup build artifacts
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "build", "dist", "__pycache__", "installer.wxs", "weeknum_build.py"
