name: Build Windows EXE on Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-release-win.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements-release-win.txt") {
            $req = Get-Content "requirements-release-win.txt" -Raw -ErrorAction SilentlyContinue
            if ($null -ne $req) { $req = $req.Trim() }
            if (-not [string]::IsNullOrWhiteSpace($req)) {
              python -m pip install --only-binary=:all: --require-hashes -r requirements-release-win.txt
            }
          }

      - name: Prepare version info
        shell: pwsh
        run: |
          $appVersion = (python -c "from weeknum_core import APP_VERSION; print(APP_VERSION)").Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid APP_VERSION in weeknum_core.py: $appVersion"
          }

          $tag = "${{ github.event.release.tag_name }}"
          if ("${{ github.event_name }}" -eq "release") {
            $tagVersion = $tag.TrimStart("v", "V")
            if ($tagVersion -match '^(\d+\.\d+\.\d+)') {
              $releaseVersion = $Matches[1]
            } else {
              throw "Release tag does not contain a semantic version: $tag"
            }
            if ($releaseVersion -ne $appVersion) {
              throw "Release tag version $releaseVersion does not match APP_VERSION $appVersion"
            }
          }

          $ver = $appVersion
          $major = 0; $minor = 0; $patch = 0; $build = 0
          if ($ver -match '^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]
            if ($Matches[4]) { $build = [int]$Matches[4] }
          }
          $versionTuple = "$major, $minor, $patch, $build"
          $versionStr = "$major.$minor.$patch.$build"
          (Get-Content "version_info.txt" -Raw) `
            -replace "__VERSION_TUPLE__", $versionTuple `
            -replace "__VERSION_STR__", $versionStr `
            | Set-Content "version_info.txt" -Encoding UTF8

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name WeekNumApp --clean --icon icons\WeekNum.ico --add-data "branding\weeknum_banner.png;branding" --add-data "icons\WeekNum.ico;icons" --version-file version_info.txt weeknum_app.py

      - name: Name EXE (dev releases)
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.0" }
          $ver = $tag.TrimStart("v", "V")

          $target = "${{ github.event.release.target_commitish }}"
          if ([string]::IsNullOrWhiteSpace($target)) { $target = "${{ github.ref_name }}" }

          $exeName = "WeekNumApp.exe"
          if ($eventName -eq "release" -and $target -eq "dev") {
            $exeName = "WeekNumApp_$ver.exe"
            Rename-Item -Path "dist\\WeekNumApp.exe" -NewName $exeName -Force
          }

          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package (zip)
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.run_number }}" }
          $zipName = "WeekNumApp-$tag-windows-x64.zip"
          Compress-Archive -Path "dist\\${{ env.EXE_NAME }}" -DestinationPath $zipName -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.run_number }}" }
          $shaName = "WeekNumApp-$tag-SHA256SUMS.txt"
          $zipHash = (Get-FileHash "${{ env.ZIP_NAME }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  ${{ env.ZIP_NAME }}" | Out-File -FilePath $shaName -Encoding ascii
          "SHA256_NAME=$shaName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/${{ env.SHA256_NAME }}

      - name: Upload artifacts to Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Release tag is missing." }
          gh release upload $tag "${{ env.ZIP_NAME }}" --clobber
          gh release upload $tag "${{ env.SHA256_NAME }}" --clobber

      - name: Cleanup build artifacts
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "build", "dist", "__pycache__", "installer.wxs"
