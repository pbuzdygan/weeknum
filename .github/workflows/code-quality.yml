name: Code quality

on:
  push:
    branches: [main, dev]
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/code-quality.yml"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/code-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile weeknum_app.py weeknum_core.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
